<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RelayDesk</title><link rel="stylesheet" href="/style.css"></head><body>
<aside class="rail"><div class="brand"><span class="logo">R</span><div>RelayDesk<small>PRIVATE WORKSPACE</small></div></div><div class="section">ワークスペース</div><button class="nav active" data-view="attention">◎　優先度つきの連絡</button><button class="nav" data-view="apps">▦　アプリごとの画面</button><button class="nav" data-view="inbox">▤　すべての会話 <span id="count">0</span></button><button class="nav" data-view="drafts">✎　承認待ちの返信</button><button class="nav" data-view="connections">⊞　接続アカウント</button><button hidden class="nav" data-view="mobile">▯　スマートフォン接続</button><button class="nav" data-view="ai">✧　ChatGPT連携</button><button class="nav" data-view="capabilities">▧　機能の対応状況</button><button class="nav" data-view="notifications">◉　通知管理</button><div class="section">接続サービス</div><div id="services"></div><div class="rail-bottom"><span class="dot"></span> このPCだけに暗号化保存<small>PC版・開発中 / 終了は通知領域から</small></div></aside>
<main><header><div><div class="eyebrow">YOUR CONVERSATIONS, TOGETHER</div><h1 id="page-title">統合受信箱</h1></div><button id="sync" class="primary">↻ 同期する</button></header><div id="notice" role="status"></div><div id="content"></div></main>
<dialog id="connect-dialog"><form id="connect-form"><div class="dialog-header"><h2>アカウントを接続</h2><button type="button" id="close-dialog" class="icon" aria-label="閉じる">×</button></div><p class="muted">認証情報はこのPC内に暗号化保存します。チャットには貼り付けないでください。</p><label>接続方式<select name="adapter"><option value="line">LINE（スマートフォンでQR認証）</option><option value="messenger">Messenger（公式画面でログイン）</option><option value="matrix">詳細：自分のMatrixブリッジ</option><option value="discord">Discord（公式Bot API）</option><option value="instagram">Instagram（公式画面でログイン）</option><option value="imap">メール（IMAP / SMTP）</option><option value="slack">Slack（公式画面でログイン）</option><option value="sendy">Sendy経由（読み取り連携）</option></select></label><label>表示名<input name="name" required placeholder="個人用メール など" maxlength="100"></label><div id="adapter-fields"></div><p class="safety">初回接続ではChatGPTへの共有はオフです。送信対応の接続では、宛先・本文を確認して承認してから送信します。</p><p id="form-error" role="alert"></p><button type="submit" class="primary full">接続してメッセージを取得</button></form></dialog>
<script src="/app.js" type="module"></script></body></html>
